<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#014486">
<meta name="description" content="Gestisci i tuoi contatti commerciali">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Partner CRM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#0176d3;--primary-dark:#014486;--bg:#f3f3f3;--card:#fff;--text:#181818;--text2:#555;--border:#d8dde6;--success:#2e844a;--danger:#ea001e;--warning:#fe9339;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
/* NAV */
.nav{background:var(--primary-dark);color:#fff;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav h1{font-size:18px;font-weight:600;letter-spacing:.5px}
.nav-right{display:flex;align-items:center;gap:12px}
.nav button{background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 16px;border-radius:var(--radius);cursor:pointer;font-size:13px;transition:.2s}
.nav button:hover{background:rgba(255,255,255,.25)}
.user-badge{font-size:12px;opacity:.8}
/* LAYOUT */
.container{max-width:1100px;margin:0 auto;padding:20px}
/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:0}
.tab{padding:10px 20px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text2);border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
/* CARD */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;margin-bottom:20px}
.card h2{font-size:20px;margin-bottom:20px;color:var(--primary-dark)}
/* STEPPER */
.stepper{display:flex;gap:0;margin-bottom:28px;overflow-x:auto;padding-bottom:8px}
.step-dot{display:flex;align-items:center;gap:0}
.step-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:2px solid var(--border);color:var(--text2);background:#fff;flex-shrink:0;transition:.3s}
.step-circle.active{border-color:var(--primary);background:var(--primary);color:#fff}
.step-circle.done{border-color:var(--success);background:var(--success);color:#fff}
.step-line{width:32px;height:2px;background:var(--border);flex-shrink:0}
.step-line.done{background:var(--success)}
.step-label{font-size:10px;text-align:center;margin-top:4px;color:var(--text2);max-width:60px}
.step-item{display:flex;flex-direction:column;align-items:center}
/* FORM */
.form-step{display:none}
.form-step.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;transition:.2s;font-family:inherit}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(1,118,211,.15)}
.field textarea{resize:vertical;min-height:80px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* TAGS */
.tags-container{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:#e1f5fe;color:var(--primary-dark);border-radius:20px;font-size:12px;font-weight:500}
.tag .remove-tag{cursor:pointer;font-size:14px;opacity:.6;margin-left:2px}
.tag .remove-tag:hover{opacity:1}
.tag-input-wrap{display:flex;gap:8px}
.tag-input-wrap input{flex:1}
.tag-input-wrap button{padding:8px 16px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-size:13px;white-space:nowrap}
.saved-tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.saved-tag{padding:4px 10px;background:#f0f0f0;border:1px solid var(--border);border-radius:20px;font-size:11px;cursor:pointer;transition:.2s}
.saved-tag:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
/* BUTTONS */
.btn-row{display:flex;justify-content:space-between;margin-top:24px}
.btn{padding:10px 24px;border:none;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-success{background:var(--success);color:#fff;font-size:16px;padding:14px 36px}
.btn-success:hover{background:#236b3b}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#fafafa;border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2)}
td{padding:10px 12px;border-bottom:1px solid #eee}
tr:hover td{background:#f8fbff}
.contact-name{font-weight:600;color:var(--primary)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500}
/* REMINDER TYPE */
.reminder-row{display:flex;gap:12px;align-items:end}
.reminder-row .field{flex:1}
/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;padding:14px 24px;background:var(--success);color:#fff;border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.15);font-size:14px;transform:translateY(100px);opacity:0;transition:.4s;z-index:200}
.toast.show{transform:translateY(0);opacity:1}
/* LOGIN */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--primary-dark),var(--primary))}
.login-card{background:#fff;border-radius:12px;padding:48px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.2);max-width:400px;width:90%}
.login-card h1{color:var(--primary-dark);margin-bottom:8px;font-size:28px}
.login-card p{color:var(--text2);margin-bottom:28px;font-size:14px}
.login-card .btn{width:100%;padding:14px;font-size:15px}
.login-card .logo{font-size:48px;margin-bottom:16px}
/* SEARCH */
.search-bar{display:flex;gap:12px;margin-bottom:16px}
.search-bar input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px}
.search-bar select{padding:10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;min-width:140px}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center;border-left:4px solid var(--primary)}
.stat-card .num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .label{font-size:11px;color:var(--text2);text-transform:uppercase;margin-top:4px}
/* DETAIL MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:32px;max-width:540px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.modal h2{margin-bottom:16px;color:var(--primary-dark)}
.modal .detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.modal .detail-label{color:var(--text2);font-weight:500}
.modal .close-btn{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text2)}
@media(max-width:600px){.field-row{grid-template-columns:1fr}.container{padding:12px}.card{padding:18px}.stepper{gap:0}.step-line{width:16px}.reminder-row{flex-direction:column}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="logo">🤝</div>
    <h1>Partner CRM</h1>
    <p>Gestisci i tuoi contatti commerciali in un click</p>
    <button class="btn btn-primary" onclick="handleLogin()">Accedi con Google</button>
    <p style="margin-top:16px;font-size:11px;color:#999">Connette Google Sheets + Calendar</p>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">
  <nav class="nav">
    <h1>🤝 Partner CRM</h1>
    <div class="nav-right">
      <span class="user-badge" id="userEmail"></span>
      <button onclick="handleLogout()">Esci</button>
    </div>
  </nav>

  <div class="container">
    <!-- TABS -->
    <div class="tabs">
      <div class="tab active" data-tab="new" onclick="switchTab('new')">+ Nuovo Partner</div>
      <div class="tab" data-tab="list" onclick="switchTab('list')">📋 Lista Contatti</div>
    </div>

    <!-- TAB: NEW PARTNER -->
    <div id="tab-new">
      <div class="card">
        <h2>Nuovo Partner</h2>

        <!-- STEPPER -->
        <div class="stepper" id="stepper"></div>

        <!-- FORM STEPS -->
        <form id="partnerForm" onsubmit="return false">

          <!-- Step 1: Nome -->
          <div class="form-step active" data-step="0">
            <div class="field-row">
              <div class="field">
                <label>Nome *</label>
                <input type="text" id="f_nome" required placeholder="Mario">
              </div>
              <div class="field">
                <label>Cognome *</label>
                <input type="text" id="f_cognome" required placeholder="Rossi">
              </div>
            </div>
          </div>

          <!-- Step 2: Azienda -->
          <div class="form-step" data-step="1">
            <div class="field">
              <label>Azienda *</label>
              <input type="text" id="f_azienda" required placeholder="Nome azienda">
            </div>
          </div>

          <!-- Step 3: Ruolo -->
          <div class="form-step" data-step="2">
            <div class="field">
              <label>Ruolo</label>
              <input type="text" id="f_ruolo" placeholder="CEO, CTO, Sales Manager...">
            </div>
          </div>

          <!-- Step 4: Contatti -->
          <div class="form-step" data-step="3">
            <div class="field-row">
              <div class="field">
                <label>Telefono</label>
                <input type="tel" id="f_telefono" placeholder="+39 333 1234567">
              </div>
              <div class="field">
                <label>Email</label>
                <input type="email" id="f_email" placeholder="mario@azienda.com">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label>Telegram</label>
                <input type="text" id="f_telegram" placeholder="@username">
              </div>
              <div class="field">
                <label>Teams</label>
                <input type="text" id="f_teams" placeholder="mario@azienda.com">
              </div>
            </div>
          </div>

          <!-- Step 5: Nota -->
          <div class="form-step" data-step="4">
            <div class="field">
              <label>Note</label>
              <textarea id="f_nota" placeholder="Appunti sul partner, contesto, interessi..."></textarea>
            </div>
          </div>

          <!-- Step 6: Progetto -->
          <div class="form-step" data-step="5">
            <div class="field">
              <label>Progetto su cui lavora</label>
              <input type="text" id="f_progetto" placeholder="Nome del progetto">
            </div>
          </div>

          <!-- Step 7: Reminder -->
          <div class="form-step" data-step="6">
            <div class="reminder-row">
              <div class="field">
                <label>Data Reminder</label>
                <input type="date" id="f_reminder_date">
              </div>
              <div class="field">
                <label>Ora</label>
                <input type="time" id="f_reminder_time" value="09:00">
              </div>
            </div>
            <div class="field" style="margin-top:12px">
              <label>Nota Reminder</label>
              <input type="text" id="f_reminder_note" placeholder="Es: Follow-up proposta commerciale">
            </div>
          </div>

          <!-- Step 8: Tags -->
          <div class="form-step" data-step="7">
            <div class="field">
              <label>Categorie / Tag</label>
              <div class="tag-input-wrap">
                <input type="text" id="f_tag_input" placeholder="Aggiungi tag e premi Invio" onkeydown="if(event.key==='Enter'){event.preventDefault();addTag()}">
                <button type="button" onclick="addTag()">+ Aggiungi</button>
              </div>
              <div class="tags-container" id="currentTags"></div>
              <div style="margin-top:12px">
                <label style="font-size:11px;margin-bottom:4px;display:block">Tag salvati (click per aggiungere):</label>
                <div class="saved-tags" id="savedTagsList"></div>
              </div>
            </div>
          </div>

        </form>

        <!-- NAV BUTTONS -->
        <div class="btn-row">
          <button class="btn btn-outline" id="btnPrev" onclick="prevStep()" style="visibility:hidden">← Indietro</button>
          <button class="btn btn-primary" id="btnNext" onclick="nextStep()">Avanti →</button>
          <button class="btn btn-success" id="btnSubmit" onclick="submitPartner()" style="display:none">✓ Salva Partner</button>
        </div>
      </div>
    </div>

    <!-- TAB: LIST -->
    <div id="tab-list" style="display:none">
      <div class="stats" id="statsBar"></div>
      <div class="card">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Cerca per nome, azienda, progetto..." oninput="renderTable()">
          <select id="filterTag" onchange="renderTable()">
            <option value="">Tutti i tag</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Nome</th><th>Azienda</th><th>Ruolo</th><th>Progetto</th><th>Tag</th><th>Reminder</th><th></th></tr>
            </thead>
            <tbody id="contactsBody"></tbody>
          </table>
        </div>
        <p id="emptyMsg" style="text-align:center;padding:32px;color:var(--text2);display:none">Nessun contatto ancora. Aggiungi il primo partner!</p>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" id="modalContent"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ====== CONFIG ======
// 👇 INSERISCI QUI IL TUO CLIENT ID DA GOOGLE CLOUD CONSOLE
const CLIENT_ID = '525708495290-u14oducrh67egbjcueh8o1pd088oe60c.apps.googleusercontent.com';
const API_KEY = 'AIzaSyAupghWIaITFNT7oIf7EpM1DPclf8q3gNE';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar.events';
const DISCOVERY_DOCS = [
  'https://sheets.googleapis.com/$discovery/rest?version=v4',
  'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'
];

let SPREADSHEET_ID = null;
const SHEET_NAME = 'Contatti';

// ====== STATE ======
let currentStep = 0;
const STEPS = ['Nome', 'Azienda', 'Ruolo', 'Contatti', 'Note', 'Progetto', 'Reminder', 'Tag'];
let currentTags = [];
let savedTags = JSON.parse(localStorage.getItem('crm_tags') || '[]');
let contacts = [];
let tokenClient;
let gapiInited = false;
let gisInited = false;

// ====== STEPPER ======
function buildStepper() {
  const s = document.getElementById('stepper');
  s.innerHTML = STEPS.map((label, i) => {
    const circleClass = i < currentStep ? 'done' : i === currentStep ? 'active' : '';
    const lineClass = i < currentStep ? 'done' : '';
    return `<div class="step-dot"><div class="step-item"><div class="step-circle ${circleClass}">${i < currentStep ? '✓' : i + 1}</div><div class="step-label">${label}</div></div>${i < STEPS.length - 1 ? `<div class="step-line ${lineClass}"></div>` : ''}</div>`;
  }).join('');
}

// ====== NAVIGATION ======
function showStep(n) {
  document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
  document.querySelector(`.form-step[data-step="${n}"]`).classList.add('active');
  document.getElementById('btnPrev').style.visibility = n === 0 ? 'hidden' : 'visible';
  document.getElementById('btnNext').style.display = n === STEPS.length - 1 ? 'none' : '';
  document.getElementById('btnSubmit').style.display = n === STEPS.length - 1 ? '' : 'none';
  buildStepper();
}

function nextStep() {
  if (currentStep === 0 && (!val('f_nome') || !val('f_cognome'))) { shake('f_nome'); return; }
  if (currentStep === 1 && !val('f_azienda')) { shake('f_azienda'); return; }
  if (currentStep < STEPS.length - 1) { currentStep++; showStep(currentStep); }
}

function prevStep() {
  if (currentStep > 0) { currentStep--; showStep(currentStep); }
}

function val(id) { return document.getElementById(id).value.trim(); }

function shake(id) {
  const el = document.getElementById(id);
  el.style.borderColor = 'var(--danger)';
  el.focus();
  setTimeout(() => el.style.borderColor = '', 1500);
}

// ====== TABS ======
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('tab-new').style.display = tab === 'new' ? '' : 'none';
  document.getElementById('tab-list').style.display = tab === 'list' ? '' : 'none';
  if (tab === 'list') { loadContacts(); }
}

// ====== TAGS ======
function addTag(tagName) {
  const input = document.getElementById('f_tag_input');
  const t = tagName || input.value.trim();
  if (!t || currentTags.includes(t)) return;
  currentTags.push(t);
  if (!savedTags.includes(t)) { savedTags.push(t); localStorage.setItem('crm_tags', JSON.stringify(savedTags)); }
  input.value = '';
  renderTags();
}

function removeTag(t) {
  currentTags = currentTags.filter(x => x !== t);
  renderTags();
}

function renderTags() {
  document.getElementById('currentTags').innerHTML = currentTags.map(t =>
    `<span class="tag">${t}<span class="remove-tag" onclick="removeTag('${t}')">&times;</span></span>`
  ).join('');
  document.getElementById('savedTagsList').innerHTML = savedTags.filter(t => !currentTags.includes(t)).map(t =>
    `<span class="saved-tag" onclick="addTag('${t}')">${t}</span>`
  ).join('');
  // Update filter dropdown
  const sel = document.getElementById('filterTag');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Tutti i tag</option>' + savedTags.map(t => `<option value="${t}">${t}</option>`).join('');
  sel.value = cur;
}

// ====== GOOGLE API ======
function gapiLoaded() {
  gapi.load('client', async () => {
    await gapi.client.init({ apiKey: API_KEY, discoveryDocs: DISCOVERY_DOCS });
    gapiInited = true;
  });
}

function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if (resp.error) return;
      onLoggedIn();
    }
  });
  gisInited = true;
}

function handleLogin() {
  if (!gapiInited || !gisInited) {
    // API not loaded yet, try fallback - offline mode
    showToast('⚠️ Google API non ancora caricata. Riprova tra un secondo.');
    return;
  }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

function handleLogout() {
  const token = gapi.client.getToken();
  if (token) {
    google.accounts.oauth2.revoke(token.access_token);
    gapi.client.setToken('');
  }
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = '';
}

async function onLoggedIn() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  // Get user info
  try {
    const res = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
      headers: { Authorization: `Bearer ${gapi.client.getToken().access_token}` }
    });
    const user = await res.json();
    document.getElementById('userEmail').textContent = user.email || '';
  } catch(e) {}
  await ensureSpreadsheet();
  buildStepper();
  renderTags();
  setDefaultReminderDate();
}

// ====== SPREADSHEET ======
async function ensureSpreadsheet() {
  // Check if we have a saved spreadsheet ID
  SPREADSHEET_ID = localStorage.getItem('crm_spreadsheet_id');
  if (SPREADSHEET_ID) {
    try {
      await gapi.client.sheets.spreadsheets.get({ spreadsheetId: SPREADSHEET_ID });
      return; // exists
    } catch(e) {
      SPREADSHEET_ID = null;
      localStorage.removeItem('crm_spreadsheet_id');
    }
  }
  // Create new spreadsheet
  const res = await gapi.client.sheets.spreadsheets.create({
    resource: {
      properties: { title: 'Partner CRM - Contatti' },
      sheets: [{ properties: { title: SHEET_NAME } }]
    }
  });
  SPREADSHEET_ID = res.result.spreadsheetId;
  localStorage.setItem('crm_spreadsheet_id', SPREADSHEET_ID);
  // Add headers
  await gapi.client.sheets.spreadsheets.values.update({
    spreadsheetId: SPREADSHEET_ID,
    range: `${SHEET_NAME}!A1:L1`,
    valueInputOption: 'RAW',
    resource: {
      values: [['Data', 'Nome', 'Cognome', 'Azienda', 'Ruolo', 'Telefono', 'Email', 'Telegram', 'Teams', 'Note', 'Progetto', 'Tag', 'Reminder']]
    }
  });
}

// ====== SUBMIT ======
async function submitPartner() {
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  const data = {
    nome: val('f_nome'),
    cognome: val('f_cognome'),
    azienda: val('f_azienda'),
    ruolo: val('f_ruolo'),
    telefono: val('f_telefono'),
    email: val('f_email'),
    telegram: val('f_telegram'),
    teams: val('f_teams'),
    nota: val('f_nota'),
    progetto: val('f_progetto'),
    tags: currentTags.join(', '),
    reminderDate: val('f_reminder_date'),
    reminderTime: val('f_reminder_time'),
    reminderNote: val('f_reminder_note')
  };

  try {
    // 1. Save to Google Sheets
    await gapi.client.sheets.spreadsheets.values.append({
      spreadsheetId: SPREADSHEET_ID,
      range: `${SHEET_NAME}!A:M`,
      valueInputOption: 'RAW',
      insertDataOption: 'INSERT_ROWS',
      resource: {
        values: [[
          new Date().toISOString().split('T')[0],
          data.nome, data.cognome, data.azienda, data.ruolo,
          data.telefono, data.email, data.telegram, data.teams,
          data.nota, data.progetto, data.tags,
          data.reminderDate ? `${data.reminderDate} ${data.reminderTime}` : ''
        ]]
      }
    });

    // 2. Create Google Calendar reminder
    if (data.reminderDate) {
      const startDT = `${data.reminderDate}T${data.reminderTime || '09:00'}:00`;
      const endDate = new Date(startDT);
      endDate.setHours(endDate.getHours() + 1);
      const endDT = endDate.toISOString().replace('.000Z', '');

      await gapi.client.calendar.events.insert({
        calendarId: 'primary',
        resource: {
          summary: `📞 Contattare: ${data.nome} ${data.cognome} (${data.azienda})`,
          description: `Ruolo: ${data.ruolo}\nProgetto: ${data.progetto}\nNote: ${data.reminderNote || data.nota}\n\n📧 ${data.email}\n📱 ${data.telefono}\n💬 Telegram: ${data.telegram}`,
          start: { dateTime: startDT, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
          end: { dateTime: new Date(new Date(startDT).getTime() + 3600000).toISOString(), timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
          reminders: { useDefault: false, overrides: [{ method: 'popup', minutes: 30 }, { method: 'email', minutes: 60 }] }
        }
      });
    }

    showToast('✅ Partner salvato + Reminder creato!');
    resetForm();
  } catch(e) {
    console.error(e);
    showToast('❌ Errore: ' + (e.result?.error?.message || e.message || 'Sconosciuto'));
  }

  btn.disabled = false;
  btn.textContent = '✓ Salva Partner';
}

function resetForm() {
  document.getElementById('partnerForm').reset();
  currentTags = [];
  currentStep = 0;
  showStep(0);
  renderTags();
  setDefaultReminderDate();
}

function setDefaultReminderDate() {
  const d = new Date();
  d.setDate(d.getDate() + 3);
  document.getElementById('f_reminder_date').value = d.toISOString().split('T')[0];
}

// ====== LOAD CONTACTS ======
async function loadContacts() {
  try {
    const res = await gapi.client.sheets.spreadsheets.values.get({
      spreadsheetId: SPREADSHEET_ID,
      range: `${SHEET_NAME}!A2:M1000`
    });
    const rows = res.result.values || [];
    contacts = rows.map(r => ({
      data: r[0] || '', nome: r[1] || '', cognome: r[2] || '',
      azienda: r[3] || '', ruolo: r[4] || '', telefono: r[5] || '',
      email: r[6] || '', telegram: r[7] || '', teams: r[8] || '',
      nota: r[9] || '', progetto: r[10] || '', tags: r[11] || '',
      reminder: r[12] || ''
    }));
    renderTable();
    renderStats();
  } catch(e) {
    console.error(e);
  }
}

function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const tagFilter = document.getElementById('filterTag').value;
  let filtered = contacts.filter(c => {
    const match = `${c.nome} ${c.cognome} ${c.azienda} ${c.progetto} ${c.ruolo}`.toLowerCase().includes(q);
    const tagMatch = !tagFilter || (c.tags && c.tags.split(',').map(t=>t.trim()).includes(tagFilter));
    return match && tagMatch;
  });
  const body = document.getElementById('contactsBody');
  const empty = document.getElementById('emptyMsg');
  if (filtered.length === 0) { body.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';
  body.innerHTML = filtered.map((c, i) => {
    const tagsHtml = c.tags ? c.tags.split(',').map(t => `<span class="badge" style="background:#e1f5fe;color:var(--primary-dark);margin:1px">${t.trim()}</span>`).join('') : '';
    const reminderBadge = c.reminder ? `<span class="badge" style="background:#fff8e1;color:#e65100">${c.reminder.split(' ')[0]}</span>` : '—';
    return `<tr onclick="showDetail(${i})" style="cursor:pointer">
      <td class="contact-name">${c.nome} ${c.cognome}</td>
      <td>${c.azienda}</td><td>${c.ruolo}</td><td>${c.progetto}</td>
      <td>${tagsHtml}</td><td>${reminderBadge}</td>
      <td><button class="btn btn-outline" style="padding:4px 10px;font-size:11px" onclick="event.stopPropagation();showDetail(${i})">Dettagli</button></td>
    </tr>`;
  }).join('');
}

function renderStats() {
  const total = contacts.length;
  const withReminder = contacts.filter(c => c.reminder).length;
  const projects = [...new Set(contacts.map(c => c.progetto).filter(Boolean))].length;
  const companies = [...new Set(contacts.map(c => c.azienda).filter(Boolean))].length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">Contatti</div></div>
    <div class="stat-card" style="border-left-color:var(--warning)"><div class="num">${withReminder}</div><div class="label">Con Reminder</div></div>
    <div class="stat-card" style="border-left-color:var(--success)"><div class="num">${projects}</div><div class="label">Progetti</div></div>
    <div class="stat-card" style="border-left-color:var(--danger)"><div class="num">${companies}</div><div class="label">Aziende</div></div>`;
}

function showDetail(i) {
  const c = contacts[i];
  document.getElementById('modalContent').innerHTML = `
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <h2>${c.nome} ${c.cognome}</h2>
    <div class="detail-row"><span class="detail-label">Azienda</span><span>${c.azienda}</span></div>
    <div class="detail-row"><span class="detail-label">Ruolo</span><span>${c.ruolo}</span></div>
    <div class="detail-row"><span class="detail-label">Telefono</span><span>${c.telefono ? `<a href="tel:${c.telefono}">${c.telefono}</a>` : '—'}</span></div>
    <div class="detail-row"><span class="detail-label">Email</span><span>${c.email ? `<a href="mailto:${c.email}">${c.email}</a>` : '—'}</span></div>
    <div class="detail-row"><span class="detail-label">Telegram</span><span>${c.telegram || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">Teams</span><span>${c.teams || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">Progetto</span><span>${c.progetto || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">Tag</span><span>${c.tags || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">Reminder</span><span>${c.reminder || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">Note</span><span>${c.nota || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">Aggiunto il</span><span>${c.data}</span></div>`;
  document.getElementById('detailModal').classList.add('show');
}

function closeModal() { document.getElementById('detailModal').classList.remove('show'); }
document.getElementById('detailModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

// ====== TOAST ======
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ====== PWA INSTALL ======
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner() {
  if (document.getElementById('installBanner')) return;
  const banner = document.createElement('div');
  banner.id = 'installBanner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#014486;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;z-index:300;box-shadow:0 -2px 12px rgba(0,0,0,.2)';
  banner.innerHTML = '<span style="font-size:14px">Installa Partner CRM sul tuo telefono</span><div><button onclick="installPWA()" style="background:#fff;color:#014486;border:none;padding:8px 18px;border-radius:6px;font-weight:600;cursor:pointer;margin-right:8px">Installa</button><button onclick="this.parentElement.parentElement.remove()" style="background:none;border:1px solid rgba(255,255,255,.4);color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer">No</button></div>';
  document.body.appendChild(banner);
}

async function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') showToast('App installata!');
  deferredPrompt = null;
  document.getElementById('installBanner')?.remove();
}

// iOS install hint (iOS non supporta beforeinstallprompt)
function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function isInStandaloneMode() { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone; }

if (isIOS() && !isInStandaloneMode()) {
  setTimeout(() => {
    const hint = document.createElement('div');
    hint.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#014486;color:#fff;padding:16px 20px;z-index:300;text-align:center;font-size:14px;box-shadow:0 -2px 12px rgba(0,0,0,.2)';
    hint.innerHTML = 'Per installare: tocca <strong style="font-size:18px">⎙</strong> (Condividi) poi <strong>"Aggiungi a Home"</strong> <button onclick="this.parentElement.remove()" style="position:absolute;top:8px;right:12px;background:none;border:none;color:#fff;font-size:20px;cursor:pointer">&times;</button>';
    document.body.appendChild(hint);
  }, 3000);
}

// ====== SERVICE WORKER ======
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ====== INIT ======
buildStepper();
renderTags();
</script>
